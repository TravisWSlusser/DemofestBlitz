<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side-Qlik Pre-Show</title>
<!-- The page PowerPoint hosts on the slide. Office.js tells PowerPoint the add-in is alive; the real content
     is the site page named in ?p= (default: the pre-show), filling the whole add-in box. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #10172A; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #10172A; }
</style>
</head>
<body>
  <iframe id="f" allow="autoplay; fullscreen" title="Side-Qlik Pre-Show"></iframe>
  <script>
    'use strict';
    const allowed = { preshow: '/preshow.html', home: '/', universe: '/universe.html' };
    const p = new URLSearchParams(location.search).get('p');
    document.getElementById('f').src = allowed[p] || allowed.preshow;
    if (window.Office && Office.onReady) Office.onReady(() => {});
  </script>
</body>
</html>
