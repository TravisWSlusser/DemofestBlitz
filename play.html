<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side-Qlik Blitz · Demofest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/booth.css">
<style>
  .content { padding: 0 20px 14px; }
  body { overflow: auto; }   /* fits on a booth screen; a short laptop scrolls rather than squeezing the game */
  nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 10px; gap: 12px; }
  body.in-arena nav { display: none; }   /* the arena bar carries the links; every pixel above the ticker goes to the game */
  nav .label { font-size: .8rem; }
  nav .links { display: flex; gap: 8px; }
  main { flex: 1; min-height: 0; }
  .view { display: none; height: 100%; }
  .view.show { display: flex; }

  /* ---- sign-in: the REC Room login gate ---- */
  #signin { align-items: center; justify-content: center; }
  .login-panel {
    position: relative; width: 100%; max-width: 470px;
    background: rgba(16,23,42,.92); border: 1px solid var(--cyan);
    box-shadow: 0 0 40px rgba(16,207,201,.25); padding: 26px 30px 24px; text-align: center;
  }
  .login-panel .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.10) 2px, rgba(0,0,0,.10) 4px); }
  .login-panel > * { position: relative; }
  .login-panel .logo { height: 92px; margin-bottom: 4px; filter: drop-shadow(0 0 16px rgba(16,207,201,.5)); }
  .login-panel h1 { font-family: 'VT323', monospace; font-size: 2.4rem; line-height: 1; letter-spacing: .06em; color: #fff; }
  .login-sub { font-family: 'Share Tech Mono', monospace; font-size: .6rem; letter-spacing: .3em; color: var(--cyan); text-transform: uppercase; margin: 6px 0 18px; }
  .login-panel .blurb { font-family: 'VT323', monospace; font-size: 1.15rem; color: var(--muted); line-height: 1.2; margin-bottom: 16px; }
  .field input.tri { font-size: 2.2rem; letter-spacing: .4em; text-transform: uppercase; text-align: center; width: 9ch; padding-left: .5em; }
  .err { color: #FF6B6B; font-family: 'Share Tech Mono', monospace; font-size: .62rem; letter-spacing: .05em; min-height: 14px; margin-top: 6px; }
  .login-btn { width: 100%; margin-top: 8px; padding: 13px; font-size: .85rem; letter-spacing: .2em; }
  .login-cancel { display: inline-block; background: none; border: none; color: #5b6f8c; font-family: 'Share Tech Mono', monospace; font-size: .62rem;
    letter-spacing: .15em; text-transform: uppercase; cursor: pointer; margin-top: 12px; text-decoration: none; }
  .login-cancel:hover { color: #9fb4d0; }

  /* ---- arena ---- */
  #arena { flex-direction: column; gap: 8px; padding-top: 8px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: 'Share Tech Mono', monospace; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .who .links { display: flex; align-items: center; gap: 8px; }
  .who .btn { padding: 7px 14px; font-size: .62rem; }
  .who .btn.fs { font-size: .66rem; letter-spacing: .18em; box-shadow: 0 0 16px rgba(16,207,201,.35); }
  .who .btn.fs::before { content: '\2922'; font-family: 'VT323', monospace; font-size: 1rem; line-height: 0; margin-right: 8px; vertical-align: -1px; }
  :fullscreen .who .btn.fs::before { content: '\2921'; }
  .who b { color: #fff; }
  .who .tri { font-family: 'VT323', monospace; font-size: 1.5rem; color: var(--cyan); letter-spacing: .08em; margin-right: 10px; text-transform: none; }
  .frame-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* height-led: the frame is as wide as the room left above the ticker allows (bar + ticker + gaps ≈ 112px; the game refuses anything under 640px wide), never wider than the page */
  .game-frame { position: relative; width: clamp(680px, calc((100vh - 112px) * 16 / 9), 100%);   /* never below the game's own 640x360 guard; a short screen scrolls instead */ aspect-ratio: 16/9; display: flex; margin: 0 auto; }
  .game-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #06101f; }
  .toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%) translateY(-20px); z-index: 6;
    background: var(--gold); color: #06101C; font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: .8rem; letter-spacing: .15em; text-transform: uppercase;
    padding: 10px 18px; opacity: 0; pointer-events: none; transition: all .3s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  aside { width: 100%; flex: none; }

  @media (max-width:980px){ body{ overflow:auto } .content{ height:auto; min-height:100% } .game-frame{ width:100% } }
</style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/brand/RecRoom_bg_loop1.webm" type="video/webm">
  </video>
  <div class="bg-overlay"></div>
  <div class="scanlines"></div>

  <div class="content">
  <nav>
    <span class="label">Side-Qlik Blitz &nbsp;·&nbsp; Demofest</span>
    <div class="links">
      <a class="btn ghost" href="index.html">Start over</a>
    </div>
  </nav>

  <main>
    <!-- ======== SIGN-IN ======== -->
    <section id="signin" class="view show">
      <form class="login-panel" id="form" autocomplete="off" novalidate>
        <div class="scan"></div>
        <video class="logo" autoplay muted loop playsinline aria-label="REC ROOM"><source src="assets/brand/REC_Room_logo_360.webm" type="video/webm"></video>
        <h1>INSERT COIN</h1>
        <div class="login-sub">Sign in to play · Demofest</div>
        <div class="blurb">Three letters go on the board. Your name and email stay with us so we can say thanks after the show.</div>
        <div class="field">
          <label for="pn">Name</label>
          <input id="pn" name="pn" type="text" maxlength="80" required placeholder="Your name" autocomplete="off" autocapitalize="words" readonly>
        </div>
        <div class="field">
          <label for="pe">Email</label>
          <input id="pe" name="pe" type="text" maxlength="160" required placeholder="you@company.com" autocomplete="off" inputmode="email" autocapitalize="off" spellcheck="false" readonly>
        </div>
        <div class="field">
          <label for="pt">Your three-letter tag</label>
          <input id="pt" name="pt" class="tri" autocomplete="off" type="text" maxlength="3" required placeholder="ABC" pattern="[A-Za-z]{3}" autocapitalize="characters" spellcheck="false">
          <div class="hint">Initials work. This is what shows on the leaderboard.</div>
        </div>
        <div class="field">
          <label for="pp">Where are you from?</label>
          <input id="pp" name="pp" type="text" maxlength="80" list="places" placeholder="State or country" autocomplete="off" autocapitalize="words" readonly>
          <datalist id="places"></datalist>
          <div class="hint">Optional.</div>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn login-btn" id="go" type="submit">Play &rarr;</button>
        <a class="login-cancel" href="index.html">&larr; Back</a>
      </form>
    </section>

    <!-- ======== ARENA ======== -->
    <section id="arena" class="view">
      <div class="stage">
        <div class="who">
          <div><span class="tri" id="whoTri">ABC</span><b id="whoName">Player</b> <span id="whoBest"></span></div>
          <div id="status" class="status-online">Loading the arcade…</div>
          <div class="links">
            <button class="btn fs" id="fsBtn" type="button">Full screen</button>
            <button class="btn ghost" id="switchBtn" type="button">Switch player</button>
            <button class="btn ghost" id="homeBtn" type="button">Start over</button>
          </div>
        </div>
        <div class="frame-wrap">
          <div class="game-frame frame">
            <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
            <iframe id="game" title="Side-Qlik Blitz" allow="autoplay; fullscreen" tabindex="0"></iframe>
            <div class="toast" id="toast"></div>
          </div>
        </div>
      </div>
      <aside>
        <div id="ticker"></div>
      </aside>
    </section>
  </main>
  </div>

  <script src="assets/kiosk.js"></script>
  <script src="assets/ticker.js"></script>
  <script src="assets/places.js"></script>
  <script>
  'use strict';
  /* ---- booth tuning ---- */
  const IDLE_MS   = 20000;   // no input for this long → "Still playing?"
  const PROMPT_MS = 10000;   // …and this long to answer before returning home
  const BURST_GAP = [8000, 15000];   // map rotation: one past run every 8–15s
  const API = '/api/blitz/';
  // someone who came in through the QR code is on their own phone, not the booth: no idle watchdog for them
  const REMOTE = (() => { try { return localStorage.getItem('demofest.visitor') === '1'; } catch (_) { return false; } })();

  /* ---- state ---- */
  let player = null;          // { id, name, trigram, token, place, lat, lon, high, games }
  let gameReady = false;
  let ticker = null;
  let map = null, pool = [], poolIdx = 0, burstTimer = null;   // map retired 4 Nov: stays null, bursts are no-ops
  const $ = id => document.getElementById(id);
  const frame = $('game');

  /* ---- places: datalist + resolver ---- */
  const PLACES = window.PLACES || [];
  $('places').innerHTML = PLACES.map(p => '<option value="' + p[0].replace(/"/g, '&quot;') + '">').join('');
  function resolvePlace(text){
    const t = String(text || '').trim(); if (!t) return { place: null, lat: null, lon: null };
    const lc = t.toLowerCase();
    let hit = PLACES.find(p => p[0].toLowerCase() === lc)
           || PLACES.find(p => p[0].toLowerCase().split(',')[0] === lc)
           || PLACES.find(p => p[0].toLowerCase().startsWith(lc))
           || PLACES.find(p => p[0].toLowerCase().includes(lc));
    return hit ? { place: hit[0], lat: hit[1], lon: hit[2] } : { place: t, lat: null, lon: null };
  }

  /* ---- views ---- */
  function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('show', v.id === id)); document.body.classList.toggle('in-arena', id === 'arena'); }

  /* ---- full screen: the whole arena (game + ticker). Entered on the Play click itself, since that is the user gesture; the bar button toggles it afterwards. ---- */
  function enterFullscreen(){ try { if (document.fullscreenEnabled && !document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (_) {} }
  function toggleFullscreen(){ if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else enterFullscreen(); }
  $('fsBtn').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  if (!document.fullscreenEnabled) $('fsBtn').hidden = true;

  /* ---- sign-in ---- */
  // Chrome ignores autocomplete="off" for name/email fields it recognises. Unrecognisable ids, plain text types and
  // read-only-until-touched inputs keep the booth browser's saved profile out of the form.
  document.querySelectorAll('#form input[readonly]').forEach(i => {
    const arm = () => { i.removeAttribute('readonly'); };
    i.addEventListener('focus', arm); i.addEventListener('pointerdown', arm); i.addEventListener('touchstart', arm, { passive: true });
  });
  $('pt').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3); });
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('pn').value.trim(), email = $('pe').value.trim(), trigram = $('pt').value.trim().toUpperCase();
    const err = $('err'); err.textContent = '';
    if (!name) return err.textContent = 'Tell us your name.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent = 'That email does not look right.';
    if (!/^[A-Z]{3}$/.test(trigram)) return err.textContent = 'The tag is exactly three letters.';
    enterFullscreen();   // now, while the click still counts as a gesture
    $('go').disabled = true; $('go').textContent = 'One moment…';
    const where = resolvePlace($('pp').value);
    try {
      const r = await fetch(API + 'register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, trigram, place: where.place, lat: where.lat, lon: where.lon }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.error || 'Sign-in failed (' + r.status + ')');
      player = d.player;
      try { sessionStorage.setItem('demofest.player', JSON.stringify(player)); } catch (_) {}
      enterArena();
    } catch (ex) {
      err.textContent = ex.message || 'Sign-in failed. Try again.';
    } finally { $('go').disabled = false; $('go').textContent = 'Play →'; }
  });

  /* ---- arena ---- */
  function enterArena(){
    $('whoTri').textContent = player.trigram;
    $('whoName').textContent = player.name;
    $('whoBest').textContent = player.high ? ' · your best ' + player.high.toLocaleString() : ' · first run';
    $('status').textContent = 'Loading the arcade…';
    show('arena');
    loadGame();
    if (ticker) ticker.refresh(); else ticker = Ticker.mount($('ticker'));
    startRotation();
    if (!REMOTE) Kiosk.start({ idleMs: IDLE_MS, promptMs: PROMPT_MS, onTimeout: goHome });
  }
  /* ---- map rotation: replay recent runs while nobody is scoring ---- */
  function startRotation(){
    clearTimeout(burstTimer);
    const tick = () => {
      if (document.visibilityState === 'visible' && pool.length) {
        const r = pool[poolIdx++ % pool.length];
        if (r && map) map.burst({ trigram: r.trigram, score: r.score, lat: r.lat, lon: r.lon, place: r.place });
      }
      burstTimer = setTimeout(tick, BURST_GAP[0] + Math.random() * (BURST_GAP[1] - BURST_GAP[0]));
    };
    burstTimer = setTimeout(tick, 2500);
  }
  function stopRotation(){ clearTimeout(burstTimer); burstTimer = null; }
  function loadGame(){
    gameReady = false;
    // a fresh document per player: no leftover run, no leftover audio
    frame.src = 'game/index.html?v=' + Date.now();
  }
  frame.addEventListener('load', () => { Kiosk.watch(frame); try { frame.contentWindow.focus(); } catch (_) {} });

  async function sendInit(){
    if (!player || !frame.contentWindow) return;
    let high = 0;
    try { const r = await fetch(API + 'getScores'); if (r.ok) { const d = await r.json(); high = Number(d.high) || 0; } } catch (_) {}
    frame.contentWindow.postMessage({
      type: 'BLITZ_INIT', trigram: player.trigram, territory: 'DEMOFEST', country_code: null,
      lifetime: 0, territoryHigh: high
    }, '*');
    $('status').textContent = 'Signed in · aim and fire';
  }
  async function submitScore(r){
    if (!player) return;
    const payload = { playerId: player.id, token: player.token, score: r.score, durationSec: r.durationSec, stats: r.stats || {} };
    try {
      const res = await fetch(API + 'logScore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || !d.ok) throw new Error(d.error || res.status);
      const score = Math.round(Number(r.score) || 0);
      const newBest = d.high === score && (player.games || 0) > 0 && score > (player.high || 0);
      player.high = d.high; player.games = d.games;
      $('whoBest').textContent = ' · your best ' + player.high.toLocaleString();
      if (map) map.burst({ trigram: player.trigram, score, lat: player.lat, lon: player.lon, place: player.place, big: true });
      toast(d.roomHigh === score && score > 0 ? '★ NEW DEMOFEST HIGH ★ ' + score.toLocaleString()
            : newBest ? 'New personal best: ' + score.toLocaleString()
            : 'Score saved: ' + score.toLocaleString());
      if (ticker) ticker.refresh();
    } catch (ex) {
      toast('Could not save that run (' + (ex.message || 'network') + ')');
    }
  }
  window.addEventListener('message', e => {
    if (e.source !== frame.contentWindow) return;      // only our own iframe
    const d = e.data || {};
    if (d.type === 'BLITZ_READY')  { gameReady = true; sendInit(); }
    if (d.type === 'BLITZ_RESULT') { submitScore(d); }
    if (d.type === 'BLITZ_EXIT')   { goHome(); }
  });

  let toastT = null;
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500); }


  /* ---- leaving ---- */
  function abandonGame(){ try { frame.contentWindow && frame.contentWindow.postMessage({ type: 'BLITZ_ABANDON' }, '*'); } catch (_) {} }
  function goHome(){ abandonGame(); Kiosk.stop(); stopRotation(); location.href = 'index.html'; }
  $('switchBtn').addEventListener('click', () => {
    abandonGame(); Kiosk.stop(); stopRotation();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    player = null; frame.src = 'about:blank';
    $('form').reset(); $('err').textContent = ''; document.querySelectorAll('#form input').forEach(i => { if (i.id !== 'pt') i.setAttribute('readonly', ''); });
    show('signin');   // no auto-focus: a focused field is where Chrome offers its saved profile
  });
  $('homeBtn').addEventListener('click', goHome);

  show('signin');   // no auto-focus: a focused field is where Chrome offers its saved profile
  </script>
</body>
</html>
